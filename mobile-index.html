<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tattoo mobile</title>

  <link rel="stylesheet" href="mobile-style.css">
</head>

<body>

<!-- ШАПКА -->
<header class="header">
  <div class="header__title">loraxultrasound.tatt</div>
</header>

<!-- ЛОГО СЛЕВА -->
<img src="./logo.png" class="side-logo">

<!-- КОНТЕНТ -->
<main class="content">

  <div class="card" style="--w:75%;">
    <img src="./work-big.JPG">
    <h3>SPIKEs & CROSSEs</h3>
    <p>[home freehand ://]</p>
  </div>

  <div class="card" style="--w:65%;">
    <img src="./work-small-1.JPG">
    <h3>STARs BRITHMARK</h3>
    <p>[freehand]</p>
  </div>

  <div class="card" style="--w:70%;">
    <img src="./work-small-2.JPG">
    <h3>TRIBAL BIT S</h3>
    <p>[according to the sketch]</p>
  </div>

  <div class="card" style="--w:68%;">
    <img src="./work-small-3.JPG">
    <h3>METADARK PEAKs</h3>
    <p>[freehand]</p>
  </div>

</main>

<!-- МЕНЮ -->
<nav class="nav">
  <a href="#">главная</a>
  <a href="#">эскизы</a>
  <a href="#">соцсети</a>
</nav>

<!-- СКРИПТ -->
<script>
let lastScroll = 0;

const header = document.querySelector('.header');
const nav = document.querySelector('.nav');

window.addEventListener('scroll', () => {
  const current = window.scrollY;

  if (current > lastScroll && current > 50) {
    header.classList.add('hide');
    nav.classList.add('hide');
  } else {
    header.classList.remove('hide');
    nav.classList.remove('hide');
  }

  lastScroll = current;
});
</script>

</body>
</html>
